<!-- @dsCard group="Brand" viewport="700x200" name="Logo & mark" subtitle="The Grit gold chip mark and horizontal lockup" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-ui); padding: 0; }
  .stage { min-height: 200px; display: flex; align-items: center; gap: 40px; padding: 0 40px; }
  .mark { width: 116px; height: 116px; flex: 0 0 auto; filter: drop-shadow(0 10px 24px rgba(0,0,0,0.45)); }
  .lock { height: 76px; }
  .divider { width: 1px; align-self: stretch; background: var(--border); margin: 40px 0; }
</style>
</head>
<body class="grit-wall grit-wall-depth">
<div class="stage">
  <img class="mark" src="../assets/logo-grit-mark.svg" alt="Grit mark" />
  <div class="divider"></div>
  <img class="lock" src="../assets/logo-grit-lockup.svg" alt="Grit lockup" />
</div>
</body>
</html>
