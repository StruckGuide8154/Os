<!-- @dsCard group="Type" viewport="700x180" name="Display & headings — Hanken Grotesk" subtitle="The UI typeface across heading sizes" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--surface-window); font-family: var(--font-ui); color: var(--text-heading); padding: 18px 22px; }
  .line { display: flex; align-items: baseline; gap: 16px; margin-bottom: 12px; }
  .line:last-child { margin-bottom: 0; }
  .meta { font: var(--fw-regular) 10px/1 var(--font-mono); color: var(--text-faint); width: 78px; flex: 0 0 auto; }
</style>
</head>
<body>
  <div class="line"><span class="meta">48 / 700</span><span style="font-size:var(--fs-display); font-weight:var(--fw-bold); letter-spacing:var(--ls-tight);">Grit</span></div>
  <div class="line"><span class="meta">34 / 600</span><span style="font-size:var(--fs-3xl); font-weight:var(--fw-semibold); letter-spacing:var(--ls-tight);">Built on grit</span></div>
  <div class="line"><span class="meta">26 / 600</span><span style="font-size:var(--fs-2xl); font-weight:var(--fw-semibold);">Application header</span></div>
  <div class="line"><span class="meta">20 / 600</span><span style="font-size:var(--fs-xl); font-weight:var(--fw-semibold);">Section heading</span></div>
  <div class="line"><span class="meta">17 / 600</span><span style="font-size:var(--fs-lg); font-weight:var(--fw-semibold);">Window title</span></div>
</body>
</html>
