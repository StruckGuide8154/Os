<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>Grit — Desktop</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--surface-desktop); font-family: var(--font-ui); overflow: hidden; }
  #desktop { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="desktop"></div>
<script type="text/babel" data-presets="env,react" src="apps.jsx"></script>
<script type="text/babel" data-presets="env,react" src="Desktop.jsx"></script>
<script type="text/babel">
  function boot() {
    if (!window.GritDesktop) { setTimeout(boot, 40); return; }
    ReactDOM.createRoot(document.getElementById('desktop')).render(React.createElement(window.GritDesktop));
    setTimeout(() => window.lucide && window.lucide.createIcons(), 120);
  }
  boot();
</script>
</body>
</html>
