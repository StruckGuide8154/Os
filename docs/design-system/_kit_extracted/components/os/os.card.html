<!-- @dsCard group="Components" viewport="700x440" name="OS chrome" subtitle="Window, Dock & Menu — the redesigned desktop shell" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="../../assets/wallpapers.css" />
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-ui); }
  .stage { position: relative; min-height: 440px; padding: 24px; display: flex; gap: 20px; align-items: flex-start; }
  [data-lucide] { width: 100%; height: 100%; }
</style>
</head>
<body class="grit-wall grit-wall-aurora">
<div class="stage">
  <div id="win"></div>
  <div id="menu"></div>
  <div id="dock" style="position:absolute; left:50%; bottom:18px; transform:translateX(-50%);"></div>
</div>
<script type="text/babel">
  const { Window, Dock, Menu, Button, IconButton, Badge } = window.NexusOSDesignSystem_497743;
  const I = (n) => <i data-lucide={n}></i>;

  ReactDOM.createRoot(document.getElementById('win')).render(
    <Window title="Files — Home" icon={I('folder')} width={360} height={320}
      toolbar={<>
        <IconButton size="sm" icon={I('chevron-left')} label="Back" />
        <IconButton size="sm" icon={I('chevron-right')} label="Forward" />
        <div style={{flex:1}} />
        <Button size="sm" variant="ghost" icon={I('plus')}>New</Button>
      </>}>
      <div style={{ padding: 14, display: 'flex', flexDirection: 'column', gap: 8 }}>
        {['Documents','Projects','grit-kernel','screenshots'].map((f,i) => (
          <div key={f} style={{ display:'flex', alignItems:'center', gap:10, padding:'8px 10px', borderRadius:'var(--r-sm)', background: i===2?'var(--accent-fill)':'transparent', color: i===2?'var(--text-accent)':'var(--text-body)' }}>
            <span style={{width:16,height:16,display:'inline-flex'}}>{I(i===2?'folder-open':'folder')}</span>
            <span style={{flex:1, font:'var(--fw-medium) var(--fs-sm)/1 var(--font-ui)'}}>{f}</span>
            <span className="grit-label">{12-i*3} items</span>
          </div>
        ))}
      </div>
    </Window>
  );

  ReactDOM.createRoot(document.getElementById('menu')).render(
    <Menu width={210} items={[
      { label: 'Open', icon: I('folder-open'), shortcut: '↵' },
      { label: 'Open in Terminal', icon: I('square-terminal') },
      { label: 'Rename', icon: I('pencil'), shortcut: 'F2' },
      { separator: true },
      { label: 'Compress', icon: I('file-archive') },
      { label: 'Properties', icon: I('info'), disabled: true },
      { separator: true },
      { label: 'Delete', icon: I('trash-2'), danger: true, shortcut: '⌫' },
    ]} />
  );

  function DockDemo() {
    const [active, setActive] = React.useState('files');
    const items = [
      { id:'files', icon:I('folder'), label:'Files', running:true },
      { id:'term', icon:I('square-terminal'), label:'Terminal', running:true },
      { id:'monitor', icon:I('activity'), label:'Monitor' },
      { id:'editor', icon:I('code'), label:'Editor', running:true },
      { id:'settings', icon:I('settings'), label:'Settings' },
    ].map(it => ({ ...it, active: it.id===active }));
    return <Dock items={items} onItemClick={setActive} />;
  }
  ReactDOM.createRoot(document.getElementById('dock')).render(<DockDemo />);

  setTimeout(() => window.lucide && window.lucide.createIcons(), 80);
</script>
</body>
</html>
