<!-- @dsCard group="Components" viewport="700x300" name="Form controls" subtitle="Input, Switch, Checkbox, Slider" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  html, body { margin: 0; }
  body { background: var(--surface-window); color: var(--text-body); font-family: var(--font-ui); padding: 22px 24px; }
  .grid { display: grid; grid-template-columns: 280px 1fr; gap: 22px 40px; align-items: start; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .inline { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  [data-lucide] { width: 16px; height: 16px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Input, Switch, Checkbox, Slider } = window.NexusOSDesignSystem_497743;
  const I = (n) => <i data-lucide={n}></i>;
  function Demo() {
    const [wifi, setWifi] = React.useState(true);
    const [bt, setBt] = React.useState(false);
    const [a, setA] = React.useState(true);
    const [vol, setVol] = React.useState(64);
    return (
      <div className="grid">
        <div className="stack">
          <Input placeholder="Search files…" icon={I('search')} />
          <Input defaultValue="grit.local" icon={I('globe')} />
          <Input placeholder="Invalid host" invalid icon={I('triangle-alert')} />
        </div>
        <div className="stack">
          <div className="inline">
            <Switch checked={wifi} onChange={setWifi} label="Wi-Fi" />
            <Switch checked={bt} onChange={setBt} label="Bluetooth" />
          </div>
          <div className="inline">
            <Checkbox checked={a} onChange={setA} label="Run on startup" />
            <Checkbox indeterminate label="Partial" />
            <Checkbox label="Disabled" disabled />
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <span style={{ color: 'var(--text-muted)' }}>{I('volume-2')}</span>
            <div style={{ flex: 1 }}><Slider value={vol} onChange={setVol} /></div>
            <span className="grit-label" style={{ minWidth: 28, textAlign: 'right' }}>{vol}</span>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  setTimeout(() => window.lucide && window.lucide.createIcons(), 60);
</script>
</body>
</html>
