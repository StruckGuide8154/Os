name: GHL security (beyond-zero-trust)

# Track 1 "P0 - CI surfacing" (docs/track1-repo-enforcement-todo.md):
# run the full GHL/GritHLK security verification on every PR and push, and
# surface the two machine-greppable signal lines as the job result.
on:
  push:
    branches: ["master", "dev"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ghl-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ghl-security:
    name: GHL-only trusted path + legacy quarantine
    timeout-minutes: 30
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          # 3.11.15/3.11.14 are source-only on the current Actions manifest for
          # this line; 3.11.9 is the newest 3.11 patch with a published win32-x64
          # setup-python package, so pin the exact Windows-available interpreter.
          python-version: "3.11.9"

      - name: Run GHL security verification + surface signal lines
        shell: powershell
        run: |
          powershell -NoProfile -File scripts/test/ci_security_summary.ps1
          exit $LASTEXITCODE

      - name: DEV-key provenance sign/verify self-test (not an attestation)
        shell: powershell
        run: |
          $env:GRIT_BUILDER_ID = "github:$($env:GITHUB_WORKFLOW_REF)"
          python scripts/build/gen_provenance.py `
            --out PROVENANCE.ENV `
            --artifact toolchain_pins.txt=tools/security/toolchain_pins.txt `
            --artifact reproducible_digests.txt=tools/security/reproducible_digests.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/build/verify_provenance.py PROVENANCE.ENV --expect-revision $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Remove-Item -LiteralPath PROVENANCE.ENV -Force
          exit 0
