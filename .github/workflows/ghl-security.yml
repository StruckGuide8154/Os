name: GHL security (beyond-zero-trust)

# Track 1 "P0 - CI surfacing" (docs/track1-repo-enforcement-todo.md):
# run the full GHL/GritHLK security verification on every PR and push, and
# surface the two machine-greppable signal lines as the job result.
on:
  push:
    branches: ["master", "dev"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ghl-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ghl-security:
    name: GHL-only trusted path + legacy quarantine
    # Bound untrusted-input / toolchain hangs so a wedged verification cannot
    # consume a runner indefinitely. This is deliberately generous for the
    # current verification + provenance path while still failing closed.
    timeout-minutes: 30
    # windows-latest: the guards are PowerShell 5.1 (Set-StrictMode / desktop
    # PowerShell semantics) and the repo is Windows-centric. The entry point
    # shells out to `python src/user/grithl/compiler/gritc.py`, so we also set
    # up Python on the runner.
    runs-on: windows-latest
    steps:
      - name: Checkout
        # Pin third-party Actions to immutable commits. The trailing version
        # comments make Dependabot/review updates easy without trusting a
        # mutable major tag at execution time.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Run GHL security verification + surface signal lines
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/test/ci_security_summary.ps1
          exit $LASTEXITCODE

      # Track 1 "Path to 10/10": emit a signed SLSA-style provenance record for
      # the trusted-path inputs and verify it through the Track-2/7 Ed25519 root.
      # This runs the real gen->sign->verify path in CI (no nasm/full image link
      # required: it stamps the pinned toolchain manifests, which always exist on
      # a clean checkout). A full release build calls gen_provenance.py with the
      # real KERNEL.BIN/APPS.BIN artifacts the same way.
      - name: Signed CI provenance (SLSA-style, Track-2/7 Ed25519 root)
        shell: powershell
        run: |
          $env:GRIT_BUILDER_ID = "github:$($env:GITHUB_WORKFLOW_REF)"
          python scripts/build/gen_provenance.py `
            --out PROVENANCE.ENV `
            --artifact toolchain_pins.txt=tools/security/toolchain_pins.txt `
            --artifact reproducible_digests.txt=tools/security/reproducible_digests.txt
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/build/verify_provenance.py PROVENANCE.ENV --expect-revision $env:GITHUB_SHA
          exit $LASTEXITCODE

      - name: Upload verified provenance attestation
        # Never publish an attestation from a failed generation/verification
        # path. A failed provenance check must fail closed rather than leaving
        # an artifact that could be mistaken for a successfully verified record.
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provenance
          path: PROVENANCE.ENV
          if-no-files-found: error
          # CI provenance is useful for short-lived diagnosis/review, but there
          # is no reason to retain every per-push attestation for the platform
          # default lifetime. Minimize exposure and storage footprint.
          retention-days: 7
