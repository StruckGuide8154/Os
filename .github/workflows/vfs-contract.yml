name: VFS Contract

on:
  push:
    branches:
      - vfs-foundation
  pull_request:
    paths:
      - 'src/kernel/grithlk/fat16_core.ghl'
      - 'src/kernel/grithlk/vfs_core.ghl'
      - 'src/kernel/grithlk/vfs_objects.ghl'
      - 'src/kernel/grithlk/vfs_context.ghl'
      - 'src/kernel/grithlk/vfs_path.ghl'
      - 'src/kernel/grithlk/vfs_open.ghl'
      - 'src/kernel/grithlk/vfs_lock.ghl'
      - 'src/kernel/grithlk/vfs_bootstrap.ghl'
      - 'src/kernel/grithlk/vfs_fat16_key.ghl'
      - 'src/kernel/grithlk/vfs_fat16_meta.ghl'
      - 'src/kernel/proc/handle_table.inc'
      - 'src/include/boot_memory.inc'
      - 'src/include/constants.inc'
      - 'docs/vfs-architecture.md'
      - 'docs/vfs-fat16-migration-audit.md'
      - 'scripts/test/test_vfs_contract.ps1'
      - 'scripts/test/test_vfs_objects_contract.ps1'
      - 'scripts/test/test_vfs_context_contract.ps1'
      - 'scripts/test/test_vfs_path_contract.ps1'
      - 'scripts/test/test_vfs_open_contract.ps1'
      - 'scripts/test/test_vfs_lock_contract.ps1'
      - 'scripts/test/test_vfs_bootstrap_contract.ps1'
      - 'scripts/test/test_vfs_fat16_key_contract.ps1'
      - 'scripts/test/test_vfs_fat16_meta_contract.ps1'
      - 'scripts/test/test_fat16_vfs_prereqs.ps1'
      - 'scripts/test/test_handle_table_authority.ps1'
      - '.github/workflows/vfs-contract.yml'

permissions:
  contents: write

jobs:
  vfs-contract:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and verify VFS policy core
        shell: pwsh
        run: ./scripts/test/test_vfs_contract.ps1

      - name: Compile and verify VFS object pools
        shell: pwsh
        run: ./scripts/test/test_vfs_objects_contract.ps1

      - name: Compile and verify per-slot VFS context
        shell: pwsh
        run: ./scripts/test/test_vfs_context_contract.ps1

      - name: Compile and verify canonical VFS path iterator
        shell: pwsh
        run: ./scripts/test/test_vfs_path_contract.ps1

      - name: Compile and verify VFS open-rights firewall
        shell: pwsh
        run: ./scripts/test/test_vfs_open_contract.ps1

      - name: Compile and verify VFS no-steal locks
        shell: pwsh
        run: ./scripts/test/test_vfs_lock_contract.ps1

      - name: Compile and verify VFS cold bootstrap
        shell: pwsh
        run: ./scripts/test/test_vfs_bootstrap_contract.ps1

      - name: Compile and verify FAT16 VFS keys
        shell: pwsh
        run: ./scripts/test/test_vfs_fat16_key_contract.ps1

      - name: Compile and verify FAT16 metadata firewall
        shell: pwsh
        run: ./scripts/test/test_vfs_fat16_meta_contract.ps1

      - name: Compile and verify FAT16 runtime prerequisites
        shell: pwsh
        run: ./scripts/test/test_fat16_vfs_prereqs.ps1

      - name: Verify handle authority is kernel-owned
        shell: pwsh
        run: ./scripts/test/test_handle_table_authority.ps1

      - name: Install NASM
        shell: pwsh
        run: choco install nasm -y --no-progress

      - name: Assemble VFS modules as one kernel translation unit
        shell: pwsh
        run: |
          $harness = @'
          bits 64
          %macro FN_BEGIN 4
          %1:
          %endmacro
          %macro FN_ARG 3
          %endmacro
          %macro FN_END 1
          %endmacro
          %ifmacro extern 1-*
          %unmacro extern 1-*
          %endif
          %macro extern 1-*
          %endmacro
          %ifmacro global 1-*
          %unmacro global 1-*
          %endif
          %macro global 1-*
          %endmacro
          section .text
          blk_self_tag:
              mov eax, 1
              ret
          blk_held_push:
              ret
          blk_held_pop:
              ret
          section .text
          %include "build/test-vfs/vfs_core.asm"
          section .text
          %include "build/test-vfs/vfs_objects.asm"
          section .text
          %include "build/test-vfs/vfs_context.asm"
          section .text
          %include "build/test-vfs/vfs_path.asm"
          section .text
          %include "build/test-vfs/vfs_open.asm"
          section .text
          %include "build/test-vfs/vfs_lock.asm"
          section .text
          %include "build/test-vfs/vfs_bootstrap.asm"
          section .text
          %include "build/test-vfs/vfs_fat16_key.asm"
          section .text
          %include "build/test-vfs/vfs_fat16_meta.asm"
          '@
          $harnessPath = Join-Path $env:RUNNER_TEMP 'grit-vfs-linkage.asm'
          [System.IO.File]::WriteAllText($harnessPath, $harness, [System.Text.Encoding]::ASCII)
          nasm -f win64 -o build\test-vfs\vfs_linkage.obj -I "$PWD\" $harnessPath
          if ($LASTEXITCODE -ne 0) { throw 'VFS single-TU linkage assembly failed' }

      - name: Assemble hardened handle table
        shell: pwsh
        run: |
          New-Item -Path build\test-vfs -ItemType Directory -Force | Out-Null
          $harness = @'
          bits 64
          %include "constants.inc"
          section .data
          align 8
          l3_app_arena_base_v: dq APP_DATA_ADDR
          section .text
          %include "src/kernel/proc/handle_table.inc"
          '@
          $harnessPath = Join-Path $env:RUNNER_TEMP 'grit-handle-table-compile.asm'
          [System.IO.File]::WriteAllText($harnessPath, $harness, [System.Text.Encoding]::ASCII)
          nasm -f win64 -o build\test-vfs\handle_table.obj `
            -I "$PWD\src\include\" -I "$PWD\" `
            $harnessPath
          if ($LASTEXITCODE -ne 0) { throw 'handle_table.inc standalone assembly failed' }

      - name: Integrate verified VFS modules into canonical kernel build
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          build = Path('scripts/build/build_uefi.ps1')
          kernel = Path('src/kernel/kernel_build.asm')
          bt = build.read_text(encoding='utf-8')
          kt = kernel.read_text(encoding='utf-8')

          registry_anchor = "    @{ src = 'src\\kernel\\grithlk\\fat16_core.ghl'; out = 'build\\ghl\\fat16_core.asm' },"
          registry_add = """    # Capability-safe VFS foundation. Kept adjacent to FAT16 while the
              # compatibility backend is migrated behind generic VFS objects/capabilities.
              @{ src = 'src\\kernel\\grithlk\\vfs_core.ghl'; out = 'build\\ghl\\vfs_core.asm' },
              @{ src = 'src\\kernel\\grithlk\\vfs_lock.ghl'; out = 'build\\ghl\\vfs_lock.asm' },
              @{ src = 'src\\kernel\\grithlk\\vfs_objects.ghl'; out = 'build\\ghl\\vfs_objects.asm' },
              @{ src = 'src\\kernel\\grithlk\\vfs_open.ghl'; out = 'build\\ghl\\vfs_open.asm' },
              @{ src = 'src\\kernel\\grithlk\\vfs_context.ghl'; out = 'build\\ghl\\vfs_context.asm' },
              @{ src = 'src\\kernel\\grithlk\\vfs_path.ghl'; out = 'build\\ghl\\vfs_path.asm' },
              @{ src = 'src\\kernel\\grithlk\\vfs_fat16_key.ghl'; out = 'build\\ghl\\vfs_fat16_key.asm' },
              @{ src = 'src\\kernel\\grithlk\\vfs_fat16_meta.ghl'; out = 'build\\ghl\\vfs_fat16_meta.asm' },
              @{ src = 'src\\kernel\\grithlk\\vfs_bootstrap.ghl'; out = 'build\\ghl\\vfs_bootstrap.asm' },"""

          include_anchor = 'section .text\n%include "build/ghl/fat16_core.asm"'
          include_add = '''section .text
          %include "build/ghl/fat16_core.asm"
          ; Capability-safe VFS foundation. Linked into the common BIOS/UEFI
          ; kernel TU, but bootstrap remains disconnected from kmain for now.
          section .text
          %include "build/ghl/vfs_core.asm"
          section .text
          %include "build/ghl/vfs_lock.asm"
          section .text
          %include "build/ghl/vfs_objects.asm"
          section .text
          %include "build/ghl/vfs_open.asm"
          section .text
          %include "build/ghl/vfs_context.asm"
          section .text
          %include "build/ghl/vfs_path.asm"
          section .text
          %include "build/ghl/vfs_fat16_key.asm"
          section .text
          %include "build/ghl/vfs_fat16_meta.asm"
          section .text
          %include "build/ghl/vfs_bootstrap.asm"'''

          already_registry = "src\\kernel\\grithlk\\vfs_core.ghl" in bt
          already_include = 'build/ghl/vfs_core.asm' in kt
          if already_registry != already_include:
              raise SystemExit('partial VFS integration detected; refusing asymmetric patch')

          if not already_registry:
              if bt.count(registry_anchor) != 1:
                  raise SystemExit(f'expected exactly one FAT16 registry anchor, got {bt.count(registry_anchor)}')
              if kt.count(include_anchor) != 1:
                  raise SystemExit(f'expected exactly one FAT16 include anchor, got {kt.count(include_anchor)}')
              bt = bt.replace(registry_anchor, registry_anchor + '\n' + registry_add, 1)
              kt = kt.replace(include_anchor, include_add, 1)
              build.write_text(bt, encoding='utf-8')
              kernel.write_text(kt, encoding='utf-8')

          expected = ['vfs_core','vfs_lock','vfs_objects','vfs_open','vfs_context','vfs_path','vfs_fat16_key','vfs_fat16_meta','vfs_bootstrap']
          bt2 = build.read_text(encoding='utf-8')
          kt2 = kernel.read_text(encoding='utf-8')
          for name in expected:
              if bt2.count(f"src\\kernel\\grithlk\\{name}.ghl") != 1:
                  raise SystemExit(f'{name}: registry source missing/duplicated')
              if bt2.count(f"build\\ghl\\{name}.asm") != 1:
                  raise SystemExit(f'{name}: registry output missing/duplicated')
              if kt2.count(f'build/ghl/{name}.asm') != 1:
                  raise SystemExit(f'{name}: kernel include missing/duplicated')
          print('Verified canonical integration for 9 VFS modules.')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'guarded VFS integration patch failed' }

          if (-not (git diff --quiet -- scripts/build/build_uefi.ps1 src/kernel/kernel_build.asm)) {
            git config user.name 'Grit VFS Integration Bot'
            git config user.email 'actions@users.noreply.github.com'
            git add scripts/build/build_uefi.ps1 src/kernel/kernel_build.asm
            git commit -m 'vfs: wire foundation into canonical kernel build'
            git push origin HEAD:vfs-foundation
            if ($LASTEXITCODE -ne 0) { throw 'VFS integration push failed' }
          } else {
            Write-Host 'Canonical VFS integration already present.' -ForegroundColor Green
          }
