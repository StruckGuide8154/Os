name: VFS Contract

on:
  push:
    branches:
      - vfs-foundation
  pull_request:
    paths:
      - 'src/kernel/grithlk/vfs_core.ghl'
      - 'src/kernel/grithlk/vfs_objects.ghl'
      - 'src/kernel/grithlk/vfs_fat16_key.ghl'
      - 'src/kernel/proc/handle_table.inc'
      - 'src/include/boot_memory.inc'
      - 'src/include/constants.inc'
      - 'docs/vfs-architecture.md'
      - 'scripts/test/test_vfs_contract.ps1'
      - 'scripts/test/test_vfs_objects_contract.ps1'
      - 'scripts/test/test_vfs_fat16_key_contract.ps1'
      - 'scripts/test/test_handle_table_authority.ps1'
      - '.github/workflows/vfs-contract.yml'

permissions:
  contents: read

jobs:
  vfs-contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and verify VFS policy core
        shell: pwsh
        run: ./scripts/test/test_vfs_contract.ps1

      - name: Compile and verify VFS object pools
        shell: pwsh
        run: ./scripts/test/test_vfs_objects_contract.ps1

      - name: Compile and verify FAT16 VFS keys
        shell: pwsh
        run: ./scripts/test/test_vfs_fat16_key_contract.ps1

      - name: Verify handle authority is kernel-owned
        shell: pwsh
        run: ./scripts/test/test_handle_table_authority.ps1

      - name: Install NASM
        shell: pwsh
        run: choco install nasm -y --no-progress

      - name: Assemble hardened handle table
        shell: pwsh
        run: |
          New-Item -Path build\test-vfs -ItemType Directory -Force | Out-Null
          $harness = @'
          bits 64
          %include "constants.inc"
          section .data
          align 8
          l3_app_arena_base_v: dq APP_DATA_ADDR
          section .text
          %include "src/kernel/proc/handle_table.inc"
          '@
          $harnessPath = Join-Path $env:RUNNER_TEMP 'grit-handle-table-compile.asm'
          [System.IO.File]::WriteAllText($harnessPath, $harness, [System.Text.Encoding]::ASCII)
          nasm -f win64 -o build\test-vfs\handle_table.obj `
            -I "$PWD\src\include\" -I "$PWD\" `
            $harnessPath
          if ($LASTEXITCODE -ne 0) { throw 'handle_table.inc standalone assembly failed' }
