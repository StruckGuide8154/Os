name: Python tooling CI

on:
  push:
    branches: ["master"]
    paths:
      - "tools/**.py"
      - "scripts/build/verify_provenance.py"
      - "scripts/build/write_envelope.py"
      - "scripts/build/ed25519_host.py"
      - "scripts/build/test_verify_provenance.py"
      - "scripts/build/test_write_envelope.py"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "tools/**.py"
      - "scripts/build/verify_provenance.py"
      - "scripts/build/write_envelope.py"
      - "scripts/build/ed25519_host.py"
      - "scripts/build/test_verify_provenance.py"
      - "scripts/build/test_write_envelope.py"
      - ".github/workflows/python-ci.yml"

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, compile & provenance parser tests
    # Pin the runner OS generation instead of following the mutable
    # ubuntu-latest alias. The image itself still receives security updates,
    # but a future alias migration cannot silently change the CI platform.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        # Execute the reviewed Action commit, not a mutable major-version tag.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # This workflow never pushes; do not leave a write-capable credential
          # in the local git config for later steps to inherit.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          # Keep the interpreter itself reviewable/reproducible. A bare `3.11`
          # tracks the newest 3.11.x and can change CI behavior without a diff.
          python-version: "3.11.15"

      - name: Install Ruff
        # Pin the executed linter so a future upstream release cannot silently
        # change CI behavior or become an unreviewed supply-chain input. Require
        # a prebuilt wheel so pip cannot fall back to executing an sdist build
        # backend during CI, and disable prompts/caching for a fail-closed,
        # ephemeral install path.
        env:
          PIP_NO_INPUT: "1"
        run: python -m pip install --disable-pip-version-check --no-deps --no-cache-dir --only-binary=:all: "ruff==0.16.0"

      - name: Ruff (lint tooling)
        # Keep the existing tooling lint gate scoped to tools/ so unrelated
        # legacy build scripts are not silently pulled into this change.
        run: ruff check tools --output-format=github

      - name: Byte-compile Python tooling and provenance verifier
        run: |
          python -m compileall -q tools
          python -m py_compile scripts/build/verify_provenance.py scripts/build/write_envelope.py scripts/build/ed25519_host.py scripts/build/test_verify_provenance.py scripts/build/test_write_envelope.py

      - name: Provenance parser fail-closed regression tests
        run: python scripts/build/test_verify_provenance.py

      - name: Provenance writer integrity regression tests
        run: python scripts/build/test_write_envelope.py
