name: Python tooling CI

on:
  push:
    branches: ["master"]
    paths: ["tools/**.py", ".github/workflows/python-ci.yml"]
  pull_request:
    branches: ["master"]
    paths: ["tools/**.py", ".github/workflows/python-ci.yml"]

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & compile (Python tooling)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # Execute the reviewed Action commit, not a mutable major-version tag.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # This workflow never pushes; do not leave a write-capable credential
          # in the local git config for later steps to inherit.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff
      - name: Ruff (lint)
        run: ruff check tools --output-format=github
        continue-on-error: true
      - name: Byte-compile all tools
        run: python -m compileall -q tools
