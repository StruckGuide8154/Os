name: Python tooling CI

on:
  push:
    branches: ["master"]
    paths:
      - "tools/**.py"
      - "scripts/build/gen_provenance.py"
      - "scripts/build/verify_provenance.py"
      - "scripts/build/write_envelope.py"
      - "scripts/build/ed25519_host.py"
      - "scripts/build/test_gen_provenance.py"
      - "scripts/build/test_verify_provenance.py"
      - "scripts/build/test_write_envelope.py"
      - ".github/workflows/python-ci.yml"
  pull_request:
    branches: ["master"]
    paths:
      - "tools/**.py"
      - "scripts/build/gen_provenance.py"
      - "scripts/build/verify_provenance.py"
      - "scripts/build/write_envelope.py"
      - "scripts/build/ed25519_host.py"
      - "scripts/build/test_gen_provenance.py"
      - "scripts/build/test_verify_provenance.py"
      - "scripts/build/test_write_envelope.py"
      - ".github/workflows/python-ci.yml"

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, compile & provenance parser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11.15"

      - name: Install Ruff
        env:
          PIP_NO_INPUT: "1"
        run: >-
          python -m pip install --disable-pip-version-check --no-deps --no-cache-dir
          --only-binary=:all: "ruff==0.16.0"

      - name: Ruff changed tooling files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE"
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

          mapfile -t changed < <(git diff --name-only "$base" "$GITHUB_SHA" -- 'tools/*.py' 'tools/**/*.py')
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No Python files under tools/ changed; skipping unrelated legacy lint debt."
            exit 0
          fi

          printf 'Linting changed tooling files:\n'
          printf '  %s\n' "${changed[@]}"
          ruff check "${changed[@]}" --output-format=github

      - name: Byte-compile Python tooling and provenance verifier
        run: |
          python -m compileall -q tools
          python -m py_compile scripts/build/gen_provenance.py scripts/build/verify_provenance.py scripts/build/write_envelope.py scripts/build/ed25519_host.py scripts/build/test_gen_provenance.py scripts/build/test_verify_provenance.py scripts/build/test_write_envelope.py

      - name: Provenance parser fail-closed regression tests
        run: python scripts/build/test_verify_provenance.py

      - name: Provenance writer integrity regression tests
        run: python scripts/build/test_write_envelope.py

      - name: Provenance generator identity regression tests
        run: python scripts/build/test_gen_provenance.py
